server:
  port: ${PORT:8091}

spring:
  application:
    name: worker-service

  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: analysis-workers
      auto-offset-reset: earliest
      # We commit offsets ourselves, only after a record has been processed.
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wraps the JSON deserializer so a malformed payload becomes an error we can route
      # to the DLT, instead of an exception that blocks the partition forever.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.example.kafkaintro.worker.kafka.InputEvent
        spring.json.use.type.headers: false
    listener:
      ack-mode: manual_immediate
