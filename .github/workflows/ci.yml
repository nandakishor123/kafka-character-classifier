name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write   # lets the report step publish a check run with per-test annotations

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # --fail-at-end runs every module's tests even if an earlier module fails,
      # so one run reports all failing cases.
      - name: Run unit tests
        run: mvn -B -ntp --fail-at-end test

      - name: Report test results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          check_name: Unit test results
          detailed_summary: true
          include_passed: false

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
